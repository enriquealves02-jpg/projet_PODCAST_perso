name: Daily Digest

on:
  schedule:
    # 3h07 UTC = 4h07 Paris (hiver) / 5h07 Paris (ete).
    # Minute "impaire" + heure avancee pour limiter la file d'attente GitHub Actions
    # (les crons sur les heures rondes sont souvent retardes de plusieurs heures).
    # Pour une livraison a l'heure FIXE, declenche plutot via repository_dispatch
    # depuis un cron externe (cron-job.org) - voir README.
    - cron: '7 3 * * *'
  # Declenchement manuel (bouton "Run workflow")
  workflow_dispatch:
  # Declenchement externe ponctuel a l'heure (cron-job.org -> API GitHub)
  repository_dispatch:
    types: [daily-digest]

permissions:
  contents: write
  pages: write

jobs:
  daily-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Daily Digest pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          RATING_WEBHOOK_URL: ${{ secrets.RATING_WEBHOOK_URL }}
        run: python main.py

      - name: Deploy to GitHub Pages
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          DATE=$(date +%Y-%m-%d)

          # Save digest before switching branch
          cp data/digest.html /tmp/digest.html
          cp data/digest.json /tmp/digest.json
          cp data/seen_urls.json /tmp/seen_urls_new.json

          # Fetch gh-pages if it exists, or create it
          git fetch origin gh-pages:gh-pages 2>/dev/null && git checkout gh-pages || git checkout --orphan gh-pages

          # Clean tracked files but keep archive/
          git rm -rf --ignore-unmatch index.html 2>/dev/null || true

          mkdir -p archive
          cp /tmp/digest.html index.html
          cp /tmp/digest.html "archive/${DATE}.html"
          cp /tmp/digest.json digest.json
          cp /tmp/digest.json "archive/${DATE}.json"

          # Merge des URLs publiees (memoire anti-redites, 1000 max)
          python3 - <<'EOF'
          import json, os
          old = []
          if os.path.exists("seen_urls.json"):
              try:
                  old = json.load(open("seen_urls.json", encoding="utf-8")).get("urls", [])
              except Exception:
                  old = []
          new = json.load(open("/tmp/seen_urls_new.json", encoding="utf-8")).get("urls", [])
          merged = list(dict.fromkeys(new + old))[:1000]
          json.dump({"urls": merged}, open("seen_urls.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          print(f"seen_urls.json: {len(merged)} URLs")
          EOF

          git add index.html archive/ digest.json seen_urls.json
          git commit -m "Digest ${DATE}" || echo "No changes"
          git push origin gh-pages

      - name: Upload digest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_number }}
          path: data/
          retention-days: 7
